steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: check-group-config
    entrypoint: bash
    args:
      - -ceu
      - |
        value="$$(awk '/^CLOUD_IDENTITY_CUSTOMER_ID:/ {print $$2; exit}' 02.sandbox_setup_01_gcloud/configs/provisioner-env.yaml)"
        if [[ ! "$$value" =~ ^C[A-Za-z0-9]+$ ]]; then
          echo "Set actual CLOUD_IDENTITY_CUSTOMER_ID in provisioner-env.yaml before release" >&2
          exit 1
        fi

  - name: gcr.io/cloud-builders/docker
    id: build-automation-runner
    args:
      - build
      - -f
      - 09.sandbox_gke_deployer/Dockerfile
      - -t
      - ${_AUTOMATION_IMAGE_REPO}:${_RELEASE_ID}
      - -t
      - ${_AUTOMATION_IMAGE_REPO}:latest
      - 09.sandbox_gke_deployer
  - name: gcr.io/cloud-builders/docker
    id: push-automation-runner-release
    args: ["push", "${_AUTOMATION_IMAGE_REPO}:${_RELEASE_ID}"]

  - name: gcr.io/cloud-builders/docker
    id: push-automation-runner-latest
    args: ["push", "${_AUTOMATION_IMAGE_REPO}:latest"]

  - name: gcr.io/cloud-builders/docker
    id: build-provisioner
    args:
      - build
      - -f
      - 07.sandbox_request_api/Dockerfile
      - -t
      - ${_PROVISIONER_IMAGE_REPO}:${_RELEASE_ID}
      - -t
      - ${_PROVISIONER_IMAGE_REPO}:latest
      - 07.sandbox_request_api
  - name: gcr.io/cloud-builders/docker
    id: push-provisioner-release
    args: ["push", "${_PROVISIONER_IMAGE_REPO}:${_RELEASE_ID}"]

  - name: gcr.io/cloud-builders/docker
    id: push-provisioner-latest
    args: ["push", "${_PROVISIONER_IMAGE_REPO}:latest"]

  - name: "${_AUTOMATION_IMAGE_REPO}:${_RELEASE_ID}"
    id: publish-sandbox-source
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail
        release_id="${_RELEASE_ID}"
        bash 10.sandbox_deploy_tools/publish-sandbox-source.sh "${_BUNDLE_BUCKET}" "$${release_id}" | tee /workspace/source.env
        . /workspace/source.env

        export RELEASE_ID="$${release_id}"
        export COMMIT_SHA_VALUE="${_COMMIT_SHA}"
        export RUNNER_IMAGE="${_AUTOMATION_IMAGE_REPO}:$${release_id}"
        export PROVISIONER_IMAGE="${_PROVISIONER_IMAGE_REPO}:$${release_id}"
        export ARCHIVE_URI="$${archive_uri}"
        export GENERATION="$${generation}"
        export SHA256="$${sha256}"

        python3 - <<'PY'
        import json
        import os

        payload = {
            "release_id": os.environ["RELEASE_ID"],
            "git_commit": os.environ["COMMIT_SHA_VALUE"],
            "runner_image": os.environ["RUNNER_IMAGE"],
            "provisioner_image": os.environ["PROVISIONER_IMAGE"],
            "archive_uri": os.environ["ARCHIVE_URI"],
            "generation": int(os.environ["GENERATION"]),
            "sha256": os.environ["SHA256"],
        }
        with open("/workspace/release.json", "w", encoding="utf-8") as stream:
            json.dump(payload, stream, indent=2, sort_keys=True)
        PY

        gcloud storage cp /workspace/release.json \
          "gs://${_BUNDLE_BUCKET}/platform-releases/$${release_id}/release.json"

        echo "============================================================"
        echo "PLATFORM RELEASE READY"
        echo "release_id=$${release_id}"
        echo "runner_image=${_AUTOMATION_IMAGE_REPO}:$${release_id}"
        echo "provisioner_image=${_PROVISIONER_IMAGE_REPO}:$${release_id}"
        cat /workspace/source.env
        echo "============================================================"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: roll-provisioner
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services update run-sbxtest01-provisioner \
          --project="${_SBX_GKE_PROJECT}" \
          --region="${_REGION}" \
          --image="${_PROVISIONER_IMAGE_REPO}:${_RELEASE_ID}" \
          --env-vars-file=02.sandbox_setup_01_gcloud/configs/provisioner-env.yaml \
          --clear-network \
          --quiet

substitutions:
  _SBX_GKE_PROJECT: gcp-sbx-edp-gke01
  _REGION: asia-northeast3
  _BUNDLE_BUCKET: gcp-sbx-edp-gke01-sbxtest01-bundles
  _AUTOMATION_IMAGE_REPO: asia-northeast3-docker.pkg.dev/gcp-sbx-edp-gke01/ar-sbxtest01-platform/sbxtest01-automation-runner
  _PROVISIONER_IMAGE_REPO: asia-northeast3-docker.pkg.dev/gcp-sbx-edp-gke01/ar-sbxtest01-platform/run-sbxtest01-provisioner
  _RELEASE_ID: git-manual
  _COMMIT_SHA: manual

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

timeout: 2400s
