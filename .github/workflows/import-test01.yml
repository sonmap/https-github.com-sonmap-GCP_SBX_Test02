name: Import Test01 once
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-test01.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import pinned source history
        shell: bash
        run: |
          git fetch --no-tags https://github.com/sonmap/GCP_SBX_Test01.git da8130b9491538063b9dd2ea036f92180ac0dcb6
          upstream="$(git rev-parse FETCH_HEAD)"
          current="$(git rev-parse HEAD)"
          git read-tree --reset -u "$upstream"
          git restore --source="$current" --staged --worktree -- .github/workflows/import-test01.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          imported="$(git commit-tree "$(git write-tree)" -p "$current" -p "$upstream" -m 'Import Test01 source and original Git history')"
          git push origin "$imported:refs/heads/main"
